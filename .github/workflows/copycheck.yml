name: copycheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ⛔ THE DOOR FOR THE AAC PULL REQUESTS. Copyleft reference code (ffmpeg,
  # FAAD2) may be read to understand and never copied or translated; this job
  # fails a pull request whose Go source resembles a declared reference in its
  # numeric tables or in the shape of its code, or whose references cannot be
  # read. It is a required check, not a report.
  copycheck:
    uses: go-fleettools/fleettools/.github/workflows/copycheck.yml@4aa52bd375a4e9ab75fd727f19e8eeba68310103 # v0.111.0
    with:
      # The first fleettools tag that contains copycheck; the workflow and the
      # judge are pinned to the same tag.
      version: v0.102.0
      go-version: '1.27.4'
