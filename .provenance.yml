# What this repository's authors READ while writing it, and what each reading
# allows. Checked in CI by copycheck (go-fleettools/fleettools, cmd/copycheck):
# it fetches each reference at the pinned revision, refuses a hash that differs,
# refuses a role the licence does not allow, and fails when our Go source
# resembles a reference in its numeric tables or in the shape of its code.
#
# ⛔ THE RULE, in the words it is enforced in (docs/aac-design.md): copyleft
# reference code (ffmpeg, FAAD2) may be READ to understand, never copied or
# translated, and its tables never copied verbatim.
#
# Roles: studied (read; nothing may be copied), oracle (run to compare output;
# nothing may be copied), tables-from / ported-from (permissive licences only;
# the reference must then be named in NOTICE).
#
# Not listed because there is no source to compare: the ISO/IEC 14496-26
# conformance bitstreams (oracle, hashes only, fetched at test time and never
# committed) and the 3GPP TS 26.401/26.410 documents (studied; the C code is
# distributed as a nested zip copycheck does not unpack, and its notice gives no
# permission to reproduce).
#
# To add or re-pin an entry: `copycheck pin --name N --url U --pin P --license L
# --role R --path DIR`, and read what was fetched before committing the hash.
version: 1

# ⛔ NUMBERS AND CODE. Bare values of a standard's normative tables may be held
# (decision 2026-11-10: values dictated by technical constraints are not
# original works; FFmpeg and FAAD2 reproduce them too) when DECLARED below —
# never the standard's text, never a reference's code, and the gate fails a
# code-shape match whatever is declared. Every AAC table of 32 numbers or more
# must have an entry (`kind: normative-values` with the standard and table
# number, or `kind: derived` with the paper and equation) or be generated.
# AAC lives in aac*.go.
values:
  # The Huffman codebooks. Codewords and lengths are the bare normative values;
  # the symbol-to-tuple mapping is code (aacTuples), and the codebooks are checked
  # to be complete prefix codes by TestAACCodebooksAreCompletePrefixCodes.
  - kind: normative-values
    file: aac_tables.go
    symbol: aacSpectralCodes
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; spectrum codebooks 1 to 11 codewords, values read in ffmpeg n9.0.2 libavcodec/aactab.c codes1..codes11
    rationale: a prefix code is dictated by the standard, the only values a decoder can hold are the standard's.
  - kind: normative-values
    file: aac_tables.go
    symbol: aacSpectralBits
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; spectrum codebooks 1 to 11 lengths, values read in ffmpeg n9.0.2 libavcodec/aactab.c bits1..bits11
    rationale: the lengths that go with the codewords above.
  - kind: normative-values
    file: aac_tables.go
    symbol: aacScalefactorCodes
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; scalefactor codebook codewords, values read in ffmpeg n9.0.2 libavcodec/aactab.c ff_aac_scalefactor_code
    rationale: a prefix code dictated by the standard, 121 codewords for the deltas -60 to 60.
  - kind: normative-values
    file: aac_tables.go
    symbol: aacScalefactorBits
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; scalefactor codebook lengths, values read in ffmpeg n9.0.2 libavcodec/aactab.c ff_aac_scalefactor_bits
    rationale: the lengths that go with the scalefactor codewords.
  - kind: normative-values
    file: aac_tables.go
    symbol: aacSwbLongTables
    standard: ISO/IEC 14496-3
    clause: standard table number not verified (a comment at ffmpeg aactab.c:1581 says "Table 4.110 to Table 4.128", which I did not check); band offsets for 1024-sample windows, values read in aactab.c swb_offset_1024_*
    rationale: band edges per sampling frequency are fixed by the standard so that every encoder and decoder agree.
  - kind: normative-values
    file: aac_tables.go
    symbol: aacSwbShortTables
    standard: ISO/IEC 14496-3
    clause: standard table number not verified (see above); band offsets for 128-sample windows, values read in ffmpeg aactab.c swb_offset_128_*
    rationale: the same, for the eight short windows.
  - kind: derived
    file: aac_dequant.go
    symbol: aacPow43
    source: inverse quantisation |q|^(4/3), formula as in ffmpeg aacdec_proc_template.c:46-47 (its comment cites 4.6.3.3, clause not verified against the standard); computed in code with math.Pow
    rationale: no table is held; the values are computed from the formula and rounded to float32.
  - kind: derived
    file: aac_dequant.go
    symbol: aacGain
    source: scalefactor gain 2^((sf-100)/4), as ffmpeg aactab.c:38-91 and aacdec.c:1592-1646 compute it (clause not verified against the standard); computed in code with math.Exp2
    rationale: no table is held; the values are computed from the formula and rounded to float32.
  - kind: derived
    file: aac_synth.go
    symbol: aacTNSMap
    source: TNS coefficient decoding, sin of the quantised index, as ffmpeg aacdec_dsp_template.c:158-189 and aactab.c:115-147 give it (standard clause not verified); computed in code with math.Sin
    rationale: no table is held; the reflection coefficients are computed from the formula and rounded to float32.
  - kind: derived
    file: aac_synth.go
    symbol: aacKBDLong
    source: Kaiser-Bessel-derived window, alpha 4 long and 6 short, as ffmpeg kbdwin.c:33-60 and aactab.c:97-98 compute it (standard clause not verified); computed in code
    rationale: no table is held; the windows come from go-dsp/signal's KaiserBesselDerived (its own code, checked against SciPy and a 320-bit computation of the definition) and are rounded to float32.
  - kind: derived
    file: aac_synth.go
    symbol: aacSineLong
    source: sine window, as ffmpeg sinewin_tablegen.h:58-65 computes it (standard clause not verified); computed by go-dsp/signal's Cosine
    rationale: no table is held; the windows come from signal.Cosine (sin of the exact argument) and are rounded to float32.
  # SBR (HE-AAC v1). The ten Huffman codes of the envelope and noise floor
  # scalefactors: the bare (symbol, length) pairs in code order. The codewords
  # themselves are not held: they are the canonical code of the lengths (the entries
  # are listed by increasing length), built in aac_sbr.go and checked complete by
  # TestSBRHuffmanTables. A generator read the C source once and wrote the tables.
  - kind: normative-values
    file: aac_sbr_tables.go
    symbol: aacSBRHuffSyms
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; SBR envelope and noise floor Huffman codes (t_huffman_env_1_5dB, f_huffman_env_1_5dB, t/f_huffman_env_bal_1_5dB, t/f_huffman_env_3_0dB, t/f_huffman_env_bal_3_0dB, t_huffman_noise_3_0dB, t_huffman_noise_bal_3_0dB), symbols read in ffmpeg n9.0.2 libavcodec/aac/aacdec_tab.c:116-251 (sbr_huffman_tab, first column)
    rationale: a prefix code is dictated by the standard; the only values a decoder can hold are the standard's.
  - kind: normative-values
    file: aac_sbr_tables.go
    symbol: aacSBRHuffLens
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; lengths of the same ten codes, read in ffmpeg n9.0.2 libavcodec/aac/aacdec_tab.c:116-251 (sbr_huffman_tab, second column)
    rationale: the lengths that go with the symbols above.
  - kind: normative-values
    file: aac_sbr_freq.go
    symbol: sbrOffset
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; start frequency offsets of the SBR master frequency table by sampling rate class and bs_start_freq, read in ffmpeg n9.0.2 libavcodec/aacsbrdata.h:35-42
    rationale: fixed by the standard so that every encoder and decoder build the same band table.
  - kind: derived
    file: aac_sbr_freq.go
    symbol: sbrLimWarp
    source: limiter bands per octave 2^(0.49/x) for x = 1.2, 2, 3, as ffmpeg aacsbr_template.c:141-143 states them in its comments (standard clause not verified); computed in code with math.Exp2
    rationale: no table is held; the three values are computed from their formula.
  # The SBR QMF prototype. The cosine and exponential twiddles of the two banks are
  # not tables here: they live in go-fft's DCT-IV and DST-IV plans, computed there.
  - kind: normative-values
    file: aac_sbr_qmf_tables.go
    symbol: sbrQMFWindow
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the 640 coefficients of the SBR QMF prototype window, values read in ffmpeg n9.0.2 libavcodec/aacsbrdata.h:210-371 (sbr_qmf_window_us, written there with a sign outside the macro for two entries, 384 and 512, which a first version of the generator missed), carried by a throwaway generator, never typed
    rationale: a filter bank prototype is a design result the standard fixes so that every encoder and decoder reconstruct the same signal; the only values a decoder can hold are the standard's.
  - kind: derived
    file: aac_sbr_qmf.go
    symbol: sbrAnaWindow
    source: every second tap of sbrQMFWindow (the analysis window of the 32-band bank, ffmpeg aacsbrdata.h sbr_qmf_window_ds, checked equal to it), computed in code
    rationale: no table is held; the 320 values are taken from the 640 above.
  # The SBR noise table and smoothing filter (envelope adjustment).
  - kind: normative-values
    file: aac_sbr_noise_table.go
    symbol: sbrNoiseTable
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the 512 complex values of the SBR noise generator, values read in ffmpeg n9.0.2 libavcodec/sbrdsp_template.c:112-388 (ff_sbr_noise_table, 544 entries there, the first 32 repeated at the end), carried by a throwaway generator that applies a sign written outside the macro, never typed
    rationale: a noise sequence is a fixed table the standard defines so that every decoder adds the same noise; the only values a decoder can hold are the standard's.
  - kind: derived
    file: aac_sbr_adj.go
    symbol: sbrSmooth
    source: the five taps of the smoothing filter, (1+cos(n*pi/5))/6, n = 0..4, which is the raised cosine whose taps 0.33333333333333, 0.30150283239582, 0.21816949906249, 0.11516383427084, 0.03183050093751 ffmpeg aacsbr.c:298-304 lists; computed in code, checked against them by TestSBRSmoothing
    rationale: no table is held; the five values are computed from their formula.
  # Parametric Stereo (HE-AAC v2), docs/aac-ps-design.md. The ten Huffman codes of the
  # PS data as (symbol, length) pairs in CODEWORD order (not by increasing length): the
  # codeword of an entry is the next free slot of the code space at its length, built in
  # aac_huff.go (buildListedHuff) and checked complete by TestPSHuffmanTables; every
  # real PS frame of the 801-file library is consumed to within the fill of its extension.
  - kind: normative-values
    file: aac_ps_tables.go
    symbol: aacPSHuffSyms
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; PS Huffman codes (huff_iid_df1, huff_iid_dt1, huff_iid_df0, huff_iid_dt0, huff_icc_df, huff_icc_dt, huff_ipd_df, huff_ipd_dt, huff_opd_df, huff_opd_dt), symbols read in ffmpeg n9.0.2 libavcodec/aacpsdata.c:26-89 (aacps_huff_tabs, first column), carried by a throwaway generator, never typed
    rationale: a prefix code is dictated by the standard; the only values a decoder can hold are the standard's.
  - kind: normative-values
    file: aac_ps_tables.go
    symbol: aacPSHuffLens
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; lengths of the same ten codes, read in ffmpeg n9.0.2 libavcodec/aacpsdata.c:26-89 (aacps_huff_tabs, second column)
    rationale: the lengths that go with the symbols above.
  - kind: normative-values
    file: aac_ps_tables.go
    symbol: aacPSBandOf20
    standard: ISO/IEC 14496-3
    clause: standard table number not verified (a comment at ffmpeg aacpsdata.c:99 says "Table 8.48", which I did not check); the parameter band of each of the 71 hybrid rows at 10 and 20 bands, values read in ffmpeg n9.0.2 libavcodec/aacpsdata.c:100-105 (ff_k_to_i_20)
    rationale: a band layout is fixed by the standard so that every encoder and decoder agree on which hybrid rows a parameter governs.
  - kind: normative-values
    file: aac_ps_tables.go
    symbol: aacPSBandOf34
    standard: ISO/IEC 14496-3
    clause: standard table number not verified (a comment at ffmpeg aacpsdata.c:106 says "Table 8.49", which I did not check); the parameter band of each of the 91 hybrid rows at 34 bands, values read in ffmpeg n9.0.2 libavcodec/aacpsdata.c:107-113 (ff_k_to_i_34)
    rationale: the same, for the 34-band layout.
  - kind: normative-values
    file: aac_ps_params.go
    symbol: psIIDdBCoarse
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the 15 IID steps in dB (-25, -18, -14, -10, -7, -4, -2, 0, ...), read in ffmpeg n9.0.2 libavcodec/aacps_tablegen.h:91-96 as linear gains and recovered as integers by a throwaway program (20 log10 of each gain is an integer within 1e-12)
    rationale: the quantiser of the intensity difference is fixed by the standard.
  - kind: normative-values
    file: aac_ps_params.go
    symbol: psIIDdBFine
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the 31 IID steps in dB of the fine resolution, read as above from aacps_tablegen.h:97-105
    rationale: the same, for the fine quantiser.
  - kind: derived
    file: aac_ps_params.go
    symbol: psIIDGainCoarse
    source: the linear amplitude ratio 10^(IID/20) (H. Purnhagen, "Low complexity parametric stereo coding in MPEG-4", DAFx'04, eq. 5, with the IID defined in dB, eq. 1); computed in code from psIIDdBCoarse with math.Pow; the 46 gains of both resolutions agree with the 14-digit values ffmpeg aacps_tablegen.h:91-105 holds to 6.2e-13 relative (checked once, not committed)
    rationale: no table is held; the gains are computed from their formula.
  - kind: derived
    file: aac_ps_params.go
    symbol: psIIDGainFine
    source: as psIIDGainCoarse, from psIIDdBFine
    rationale: no table is held; the gains are computed from their formula.
  - kind: normative-values
    file: aac_ps_params.go
    symbol: psICC
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the eight inter-channel coherence values (1, 0.937, 0.84118, 0.60092, 0.36764, 0, -0.589, -1), read in ffmpeg n9.0.2 libavcodec/aacps_tablegen.h:107-109 (icc_invq); no formula found
    rationale: the quantiser of the coherence is fixed by the standard.
  - kind: derived
    file: aac_ps_params.go
    symbol: psICCAngle
    source: arccos(ICC)/2 (P1 eq. 5), computed in code with math.Acos; ffmpeg's table (aacps_tablegen.h:110-112) holds the arc cosines rounded to 8 digits, so ours differs from it by up to 8.9e-8 at ICC -0.589, a known and bounded difference
    rationale: no table is held; the angles are computed from their formula.
  - kind: derived
    file: aac_ps_params.go
    symbol: psPhase
    source: the IPD and OPD index k stands for the angle k*pi/4 (eight steps of a circle); computed in code
    rationale: no table is held.
  - kind: normative-values
    file: aac_ps_params.go
    symbol: psLinkDecay
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the decay factors of the three all-pass links of the decorrelator (0.65143905753106, 0.56471812200776, 0.48954165955695), as listed in docs/aac-ps-design.md, read there in ffmpeg n9.0.2 libavcodec/aacpsdsp_template.c:29-211 (not reopened for PS1). They equal exp(-d/7) for d = 3, 4, 5 to 14 digits, but that form was recognised after the values were read and no source gives it, so it is not a derivation
    rationale: constants of the decorrelator the standard fixes; the only values a decoder can hold are the standard's.
  - kind: normative-values
    file: aac_ps_params.go
    symbol: psPeakDecay
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the decay of the transient detector's peak (0.76592833836465), as listed in docs/aac-ps-design.md, read there in ffmpeg n9.0.2 libavcodec/aacps.c:399-517 (not reopened for PS1). It equals exp(-4/15) to 14 digits; recognised after the fact, no source gives 4/15
    rationale: a constant of the transient detector the standard fixes.
  # PS2, the hybrid filter bank (docs/aac-ps-hybrid.md): written from that specification
  # alone; no reference implementation was opened for it.
  - kind: normative-values
    file: aac_ps_hybrid.go
    symbol: psTaps
    standard: ISO/IEC 14496-3
    clause: standard table numbers not verified; the 26 taps g[1..6] of the five hybrid prototypes that no formula gives (20 bands, M = 8, 6 taps; the real two-band split of QMF 1 and 2, 3 taps, the odd ones; 34 bands, M = 12, 6 taps, M = 8, 6 taps, M = 4, 5 taps), as printed in docs/aac-ps-hybrid.md table 2.3, read there in ffmpeg n9.0.2 and FAAD2 ps_dec.c (not opened for PS2). The entries at the centre and zero taps are 0 placeholders that psPrototype overwrites
    rationale: the prototype's pass band and stop band shape is not fixed by perfect reconstruction (Q4 of the specification, where no window or formula was identified), so a decoder can only hold the standard's values; TestPSHybridTaps compares them with the printed digits.
  - kind: derived
    file: aac_ps_hybrid.go
    symbol: psPrototype
    source: the centre tap g[0] = 1/M and the taps at the other multiples of M, which are 0 (4 for M = 4; 2, 4 and 6 for the two-band split, which acts as M = 2 with g[0] = 1/2), computed from the perfect reconstruction condition that the sum of the modulated filters is a unit impulse (H. Purnhagen, DAFx'04, eq. 12; docs/aac-ps-hybrid.md section 2.3); TestPSHybridTaps checks the computed values against the 14 printed digits
    rationale: a value that follows from a condition the filter bank must meet is computed, not held.
  - kind: derived
    file: aac_ps_hybrid.go
    symbol: psSpecs20
    source: which outputs of the hybrid bank are summed into one row at 20 bands, from P1 Fig. 4 (QMF 0 with M = 8, outputs 2+5 and 3+4 summed; QMF 1 and 2, the M = 4 outputs summed in the pairs (0, 3) and (1, 2), which P1 notes gives real filters); docs/aac-ps-hybrid.md section 3. TestPSHybridLayouts checks the rows against table 3 and TestPSHybridReference against the 192-bit evaluation of eq. 11
    rationale: the summed outputs are the paper's construction, and the modulation is computed from them.
  - kind: derived
    file: aac_ps_hybrid.go
    symbol: psSpecs34
    source: the 34-band layout, M = 12, 8, 4, 4, 4 for QMF 0 to 4 with no output summed (P1 section 3.2), rows in order of band and output (docs/aac-ps-hybrid.md section 4); TestPSHybridLayouts checks the rows against table 4
    rationale: the split sizes are the paper's, and the modulation of each row is computed from them.
  - kind: derived
    file: aac_ps_hybrid.go
    symbol: psFreq
    source: the centre frequency of each hybrid row, 2(m+1/2)/M modulo 2 taken in [k-1/2, k+3/2), a summed pair taking the member in [k, k+1) (docs/aac-ps-hybrid.md section 3); it fixes the order of the 20-band rows and is checked against the typed tables 3 and 4
    rationale: a centre frequency follows from the modulation of the row, so it is computed.
  - kind: normative-values
    file: aac_ps_hybrid_test.go
    symbol: psTable4F24
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the centre frequency of each split row of the 34-band layout in 1/24 band units, as docs/aac-ps-hybrid.md table 4 states them. The specification derives them from the centre frequency rule (psFreq) and checked them against the fractional-delay centre frequencies ffmpeg n9.0.2 aacps_tablegen.h holds, which is why a table check matches it
    rationale: the expected values of a test, typed from the specification, against which the computed centre frequencies are compared; nothing in the decoder reads them.
  - kind: normative-values
    file: aac_ps_hybrid_test.go
    symbol: psTable4PB
    standard: ISO/IEC 14496-3
    clause: standard table number not verified; the parameter band of each split row of the 34-band layout, as docs/aac-ps-hybrid.md table 4 states them (the same values as the first 32 entries of aacPSBandOf34)
    rationale: the expected values of a test, typed from the specification, against which the decoder's own map is compared.
require_declared:
  min_numbers: 32
  paths: [aac]

references:
  # PacketVideo's AAC decoder, Apache-2.0 as a whole. ⛔ 114 of its files (all of
  # sbr_*, ps_*, and the Huffman, TNS, PNS, LTP and bitstream readers) ALSO carry
  # the MPEG reference-software notice, which releases copyright only for
  # MPEG-2 NBC / MPEG-4 Audio CONFORMING products, with patent warnings. So the
  # role is `studied` and not `tables-from`, and the restriction below makes
  # any file that carries the notice read-only even if the role is ever changed
  # (docs/aac-design.md, "The two notices on PacketVideo", gap G4).
  - name: packetvideo-aacdec
    url: https://android.googlesource.com/platform/frameworks/av/+archive/2df63ad6bbf0ad0fd066592b44f2e15123513112.tar.gz
    pin: 2df63ad6bbf0ad0fd066592b44f2e15123513112 # tag android-4.1.1_r1
    tree_sha256: 91783255da18b129189d0fc6cbe2b92bfc1c9d935920df5d16c0e56c20e6d1db
    license: Apache-2.0
    role: studied
    strip_components: 0
    paths:
      - media/libstagefright/codecs/aacdec
    restrictions:
      - name: MPEG reference-software notice
        contains:
          # wrapped and double-spaced in the files; copycheck collapses whitespace
          - gives users of the MPEG-2 NBC/MPEG-4 Audio standards free license

  # FFmpeg: LGPL-2.1-or-later. Read for what is computed and in what order.
  # Never tables-from or ported-from: the gate refuses both for LGPL.
  - name: ffmpeg
    url: https://github.com/FFmpeg/FFmpeg/archive/946fcce07b6dcd0331c8cc609192aeff5e1924f8.tar.gz
    pin: 946fcce07b6dcd0331c8cc609192aeff5e1924f8 # tag n9.0.2
    tree_sha256: 1fd6206391eb947cb656b313987142dad2b4f4781f7906ed076a40e2da9db615
    license: LGPL-2.1-or-later
    role: studied
    paths:
      - libavcodec
      - libavutil

  # FAAD2: GPL-2.0-or-later. Run as an oracle; compared so that nothing of it
  # can have been copied by accident.
  - name: faad2
    url: https://github.com/knik0/faad2/archive/e8e76f0a44db45aed773a3f62fe35a63c867a738.tar.gz
    pin: e8e76f0a44db45aed773a3f62fe35a63c867a738 # tag 2.11.4
    tree_sha256: 1a2ce613965d4b8be9be3d8abbba192c6186d6feef7c9e83424a6e15ae135b34
    license: GPL-2.0-or-later
    role: oracle
    paths:
      - libfaad
